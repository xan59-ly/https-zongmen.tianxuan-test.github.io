<head>
<meta charset="utf-8">

<title>测测你的天选修仙宗门</title>
<meta name="description" content="四十五道题，四维命盘：灵根、道派、职业、宗门。测出你在修仙界的天选位置。">
<meta name="theme-color" content="#EFF1EC">

<style>
/* ===== 设计 token ===== */
:root{
  --paper:#EFF1EC;
  --paper-2:#E6E9E2;
  --ink:#1B2422;
  --ink-2:#4E5C58;
  --celadon:#5E7C76;
  --celadon-2:#2C4744;
  --cinnabar:#A8432E;
  --hair:rgba(27,36,34,.13);
  --hair-strong:rgba(27,36,34,.26);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{display:block}
.shell{--pad:24px;max-width:452px;margin:0 auto;min-height:100vh;padding:0 var(--pad) 0}
@media (min-width:768px){
  .shell{--pad:34px;border-left:1px solid var(--hair);border-right:1px solid var(--hair)}
}
.view{display:none}
.view.is-on{display:block}

/* ===== 通用排印 ===== */
.kicker{
  font-size:12px;letter-spacing:.26em;color:var(--celadon);
  margin:0;
}
.hair{height:1px;background:var(--hair);border:0;margin:0}
.btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:54px;border:1px solid var(--ink);border-radius:2px;
  background:var(--ink);color:var(--paper);
  font-size:15px;letter-spacing:.18em;font-weight:500;
  transition:background .18s ease,color .18s ease,opacity .18s ease;
}
.btn:active{opacity:.82}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--hair-strong)}
.btn-text{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;font-size:13px;color:var(--celadon);
  text-decoration:underline;text-decoration-color:var(--hair-strong);
  text-underline-offset:5px;letter-spacing:.06em;
}
.btn-text[disabled]{color:var(--hair-strong);opacity:.55;text-decoration:none;cursor:default}

/* ===== 视图一：入口 ===== */
.hero{
  position:relative;
  margin:0 calc(var(--pad) * -1);
  height:38vh;
  height:clamp(210px,calc(100svh - 402px),430px);
  overflow:hidden;
}
.hero img{
  width:100%;height:100%;object-fit:cover;object-position:50% 42%;
  transform:scaleX(-1);
}
.hero::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,var(--paper) 0%,rgba(239,241,236,0) 7%,rgba(239,241,236,0) 93%,var(--paper) 100%),
    linear-gradient(180deg,rgba(239,241,236,.6) 0%,rgba(239,241,236,.14) 26%,rgba(239,241,236,.9) 60%,var(--paper) 78%);
}
.hero-mark{
  position:absolute;top:18px;right:calc(var(--pad) + 2px);z-index:2;
  writing-mode:vertical-rl;
  font-family:var(--serif);font-size:12px;letter-spacing:.3em;
  color:var(--ink-2);opacity:.72;
}
.intro{position:relative;z-index:3;margin-top:-46px}
.intro-title{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(34px,9.8vw,42px);
  line-height:1.24;letter-spacing:.03em;
  margin:8px 0 0;
}
.intro-title em{font-style:normal;display:block;font-size:.5em;line-height:1.2;letter-spacing:.14em;color:var(--celadon-2);font-weight:400;margin-bottom:4px}
.lead{
  margin:14px 0 0;font-size:14px;line-height:1.82;color:var(--ink-2);
  max-width:22em;
}
.lead p{margin:0 0 8px}
.lead p:last-child{margin-bottom:0}
.meta{
  display:flex;margin:18px 0 0;padding:10px 0;
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
}
.meta span{
  flex:1;text-align:center;font-size:12px;color:var(--ink-2);
  letter-spacing:.06em;border-left:1px solid var(--hair);
}
.meta span:first-child{border-left:0}
.cta{margin:18px 0 0}
.footnote{
  margin:12px 0 26px;font-size:11.5px;color:var(--celadon);
  letter-spacing:.08em;text-align:center;
}

/* ===== 视图二：答题 ===== */
.quiz{padding-top:14px;padding-bottom:32px}
.qbar{
  display:flex;align-items:center;justify-content:space-between;
  min-height:44px;
}
.qbar .btn-text{font-size:12.5px}
.qcount{
  font-size:11.5px;letter-spacing:.16em;color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.qcount b{
  font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);
  letter-spacing:.04em;margin-right:4px;
}
.track{height:2px;background:var(--hair);margin-top:2px;overflow:hidden}
.fill{height:100%;width:0;background:var(--cinnabar);transition:width .4s cubic-bezier(.2,.7,.3,1)}
.qbody{margin-top:clamp(38px,9svh,80px)}
.qtext{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(23px,6.4vw,27px);
  line-height:1.58;letter-spacing:.01em;margin:0;
}
.qhint{margin:12px 0 0;font-size:12.5px;color:var(--ink-2);letter-spacing:.1em}
.opts{margin:30px 0 0;border-top:1px solid var(--hair)}
.opt{
  display:flex;align-items:flex-start;gap:14px;
  width:100%;min-height:66px;padding:clamp(19px,2.7svh,27px) 6px;
  text-align:left;font-size:15.5px;line-height:1.6;color:var(--ink);
  border-bottom:1px solid var(--hair);
  transition:background .16s ease,color .16s ease,border-color .16s ease;
}
.opt .idx{
  flex:0 0 18px;font-family:var(--serif);font-size:13.5px;color:var(--celadon);
  padding-top:3px;transition:color .16s ease;
}
.opt:active{background:rgba(27,36,34,.055)}
.opt.is-picked{background:var(--ink);color:var(--paper);border-bottom-color:var(--ink)}
.opt.is-picked .idx{color:rgba(239,241,236,.62)}
.qbody.is-enter .qtext,.qbody.is-enter .opts{animation:slideIn .32s cubic-bezier(.2,.7,.3,1) both}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== 视图三：结果 ===== */
.result{padding-top:26px;padding-bottom:10px}
.res-head{position:relative;text-align:center}
.seal{
  position:absolute;top:-4px;right:-2px;
  display:flex;align-items:center;justify-content:center;
  width:52px;height:52px;
  border:2px solid var(--cinnabar);border-radius:3px;
  color:var(--cinnabar);font-family:var(--serif);font-size:23px;line-height:1;
  transform:rotate(-3.5deg);opacity:.9;
  box-shadow:inset 0 0 0 2px rgba(168,67,46,.14);
}
.res-title{
  font-family:var(--serif);font-weight:600;font-size:20px;
  letter-spacing:.06em;margin:12px 0 0;color:var(--celadon-2);
}
.formula{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:6px 8px;margin:16px 0 0;
  font-family:var(--serif);font-size:18px;line-height:1.7;font-weight:600;
  letter-spacing:.02em;
}
.formula i{font-style:normal;color:var(--celadon);font-size:13px;font-weight:400}

.pan{margin-top:28px;border-top:1px solid var(--hair-strong)}
.pan-row{
  display:grid;grid-template-columns:44px 1fr;gap:14px;
  padding:17px 0 16px;border-bottom:1px solid var(--hair);
  opacity:0;transform:translateY(8px);
  animation:rise .5s cubic-bezier(.2,.7,.3,1) forwards;
}
.pan-key{
  font-size:11.5px;color:var(--celadon);letter-spacing:.2em;
  padding-top:8px;
}
.pan-val{
  font-family:var(--serif);font-size:23px;font-weight:600;
  letter-spacing:.03em;line-height:1.35;
}
.pan-sub{
  display:block;font-family:var(--sans);font-size:12px;font-weight:400;
  letter-spacing:.08em;color:var(--celadon-2);margin-top:3px;
}
.pan-desc{
  margin:7px 0 0;font-size:14px;line-height:1.8;color:var(--ink-2);
  letter-spacing:.01em;
}
@keyframes rise{to{opacity:1;transform:none}}

.verdict{
  margin-top:30px;padding:20px 0 22px;
  border-top:1px solid var(--hair-strong);border-bottom:1px solid var(--hair-strong);
}
.verdict h3{
  font-family:var(--serif);font-size:13px;font-weight:600;
  letter-spacing:.24em;color:var(--celadon);margin:0 0 14px;
}
.verdict p{
  margin:0 0 12px;font-family:var(--serif);font-size:16px;line-height:2.05;
  letter-spacing:.01em;
}
.verdict p:last-child{margin-bottom:0}
.verdict .quote{color:var(--celadon-2)}

.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.rate{border-top:1px solid var(--hair);padding-top:10px}
.rate-label{font-size:11.5px;color:var(--ink-2);letter-spacing:.16em}
.dots{display:flex;gap:4px;margin-top:9px}
.dot{width:8px;height:8px;background:var(--hair-strong)}
.dot.on{background:var(--ink)}
.dot.on.red{background:var(--cinnabar)}

.actions{margin:28px 0 0;display:flex;flex-direction:column;gap:10px}
.result-foot{
  margin:16px 0 34px;text-align:center;font-size:11.5px;color:var(--celadon);
  letter-spacing:.08em;
}

/* ===== toast ===== */
.toast{
  position:fixed;left:50%;bottom:34px;z-index:20;
  transform:translate(-50%,14px);
  background:var(--ink);color:var(--paper);
  font-size:13px;letter-spacing:.1em;padding:11px 20px;border-radius:2px;
  opacity:0;pointer-events:none;transition:opacity .26s ease,transform .26s ease;
  max-width:80vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}
  .pan-row{opacity:1;transform:none}
}
</style>
</head>

/* ===== 职业与宗门的对应关系 ===== */
const COMPAT = {
  jian:['yujian','tianji'],
  fa:['tianji','xuanfu'],
  yushou:['lingshou','fulong'],
  qi:['tiangong','xuanfu'],
  dan:['yaowang','qingmu'],
  yi:['yaowang','qingmu'],
  yuyao:['lingshou','fulong','youming'],
  mo:['xuesha','youming'],
  yin:['wangyou','qingmu']
};
/* ===== 交互与计分 ===== */
const $ = (id) => document.getElementById(id);
const IDX = ['甲','乙','丙','丁'];
const state = { i:0, locked:false, answers: QUESTIONS.map(() => -1) };

function showView(name){
  ['intro','quiz','result'].forEach(v => {
    $('view-' + v).classList.toggle('is-on', v === name);
  });
  window.scrollTo(0, 0);
}

/* --- 计分 --- */
/* 题库里每种结果的曝光量不同，按曝光量做 0.8 次幂均衡，避免选项多的类型自动占优 */
const BALANCE = 0.8;
const CEIL = (() => {
  const dicts = { j:JOBS, s:SECTS, d:DAOS, r:ROOTS };
  const out = { j:{}, s:{}, d:{}, r:{} };
  Object.keys(dicts).forEach(ax => {
    Object.keys(dicts[ax]).forEach(k => {
      out[ax][k] = QUESTIONS.reduce((sum, q) => {
        return sum + Math.max.apply(null, q.o.map(o => o.w[ax + '_' + k] || 0));
      }, 0) || 1;
    });
  });
  return out;
})();

function balance(raw, ax, key){
  return raw / Math.pow(CEIL[ax][key], BALANCE);
}

function tally(){
  const sums = { j:{}, s:{}, d:{}, r:{} };
  QUESTIONS.forEach((q, qi) => {
    const a = state.answers[qi];
    if (a < 0 || !q.o[a]) return;
    const w = q.o[a].w;
    for (const k in w){
      const ax = k.charAt(0);
      const key = k.slice(2);
      if (!sums[ax]) continue;
      sums[ax][key] = (sums[ax][key] || 0) + w[k];
    }
  });
  return sums;
}

function pickTop(sums, dict, ax){
  let best = null, bestScore = -1;
  Object.keys(dict).forEach(k => {
    const v = balance(sums[k] || 0, ax, k);
    if (v > bestScore){ bestScore = v; best = k; }
  });
  return best;
}

function computeResult(){
  const sums = tally();
  const job = pickTop(sums.j, JOBS, 'j');
  const dao = pickTop(sums.d, DAOS, 'd');
  const root = pickTop(sums.r, ROOTS, 'r');
  let sect = null, sectScore = -1;
  (COMPAT[job] || []).forEach(k => {
    const v = balance(sums.s[k] || 0, 's', k);
    if (v > sectScore){ sectScore = v; sect = k; }
  });
  if (!sect) sect = COMPAT[job][0];

  const rate = (label) => {
    const v = JOBS[job].rating[label] * 0.45
            + SECTS[sect].rating[label] * 0.3
            + DAOS[dao].rating[label] * 0.25;
    return Math.max(1, Math.min(5, Math.round(v)));
  };
  return {
    sum: sums, job, sect, dao, root,
    rates: { dao: rate('dao'), power: rate('power'), luck: rate('luck') }
  };
}

/* --- 结果渲染 --- */
function renderResult(res){
  const j = JOBS[res.job], s = SECTS[res.sect], d = DAOS[res.dao], r = ROOTS[res.root];
  const parts = [j.name, s.name, d.name, r.name + '灵根'];

  $('res-seal').textContent = j.seal;

  const fm = $('res-formula');
  fm.innerHTML = '';
  parts.forEach((p, i) => {
    if (i) {
      const sep = document.createElement('i');
      sep.textContent = '+';
      fm.appendChild(sep);
    }
    const sp = document.createElement('span');
    sp.textContent = p;
    fm.appendChild(sp);
  });

  const rows = [
    { key:'灵根', name:r.name + '灵根', sub:r.tag, desc:r.text },
    { key:'道派', name:d.name, sub:d.tag, desc:d.text },
    { key:'职业', name:j.name, sub:j.sub, desc:j.text },
    { key:'宗门', name:s.name, sub:s.loc, desc:s.text }
  ];
  const pan = $('res-pan');
  pan.innerHTML = '';
  rows.forEach((row, i) => {
    const el = document.createElement('div');
    el.className = 'pan-row';
    el.style.animationDelay = (i * 70) + 'ms';
    const left = document.createElement('div');
    left.className = 'pan-key';
    left.textContent = row.key;
    const right = document.createElement('div');
    const val = document.createElement('div');
    val.className = 'pan-val';
    val.textContent = row.name;
    const sub = document.createElement('span');
    sub.className = 'pan-sub';
    sub.textContent = row.sub;
    val.appendChild(sub);
    const desc = document.createElement('p');
    desc.className = 'pan-desc';
    desc.textContent = row.desc;
    right.appendChild(val);
    right.appendChild(desc);
    el.appendChild(left);
    el.appendChild(right);
    pan.appendChild(el);
  });

  const vd = $('res-verdict');
  vd.innerHTML = '';
  const h = document.createElement('h3');
  h.textContent = '批文';
  vd.appendChild(h);
  const p1 = document.createElement('p');
  p1.textContent = r.name + '灵根之身，落于' + s.name + '，循' + d.name + '而行。' + j.text;
  const p2 = document.createElement('p');
  p2.textContent = '宗门看中的，是「' + s.tag + '」；你真正想要的，是「' + d.tag + '」。这中间的差价，就是你还得修的那一段路。';
  const p3 = document.createElement('p');
  p3.className = 'quote';
  p3.textContent = r.place + '，是你机缘最容易落地的地方。' + j.warn;
  vd.appendChild(p1);
  vd.appendChild(p2);
  vd.appendChild(p3);

  const rates = $('res-rates');
  rates.innerHTML = '';
  [['道心','dao'],['战力','power'],['机缘','luck']].forEach(([label, key]) => {
    const box = document.createElement('div');
    box.className = 'rate';
    const lb = document.createElement('div');
    lb.className = 'rate-label';
    lb.textContent = label;
    const dots = document.createElement('div');
    dots.className = 'dots';
    for (let i = 0; i < 5; i++){
      const dt = document.createElement('span');
      dt.className = 'dot' + (i < res.rates[key] ? ' on' : '');
      if (i < res.rates[key] && key === 'power') dt.classList.add('red');
      dots.appendChild(dt);
    }
    box.appendChild(lb);
    box.appendChild(dots);
    rates.appendChild(box);
  });

  window.__shareText = '测测你的天选修仙宗门\n我的命盘：' + parts.join(' + ') + '\n「' + j.sig + '」\n你也来问问山门，看看自己是什么签。';
}

/* --- 题目渲染 --- */
function renderQuestion(){
  const q = QUESTIONS[state.i];
  $('q-now').textContent = String(state.i + 1).padStart(2, '0');
  $('q-fill').style.width = ((state.i + 1) / QUESTIONS.length * 100) + '%';
  $('q-text').textContent = q.q;

  const box = $('q-opts');
  box.innerHTML = '';
  q.o.forEach((o, idx) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (state.answers[state.i] === idx ? ' is-picked' : '');
    const tag = document.createElement('span');
    tag.className = 'idx';
    tag.textContent = IDX[idx];
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = o.t;
    b.appendChild(tag);
    b.appendChild(txt);
    b.addEventListener('click', () => pick(idx, b));
    box.appendChild(b);
  });

  const body = $('q-body');
  body.classList.remove('is-enter');
  void body.offsetWidth;
  body.classList.add('is-enter');
  syncBack();
  window.scrollTo(0, 0);
}

function syncBack(){
  $('btn-back').disabled = state.i === 0;
}

function pick(idx, btn){
  if (state.locked) return;
  state.locked = true;
  state.answers[state.i] = idx;
  Array.from($('q-opts').children).forEach(el => el.classList.remove('is-picked'));
  btn.classList.add('is-picked');
  setTimeout(() => {
    state.locked = false;
    if (state.i < QUESTIONS.length - 1){
      state.i++;
      renderQuestion();
    } else {
      renderResult(computeResult());
      showView('result');
    }
  }, 250);
}

function goBack(){
  if (state.locked || state.i === 0) return;
  state.i--;
  renderQuestion();
}

/* --- 轻提示 --- */
let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

function legacyCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
/* --- 事件 --- */
$('btn-start').addEventListener('click', () => {
  state.i = 0;
  renderQuestion();
  showView('quiz');
});
$('btn-back').addEventListener('click', goBack);
$('btn-again').addEventListener('click', () => {
  state.i = 0;
  state.answers = QUESTIONS.map(() => -1);
  state.locked = false;
  renderQuestion();
  showView('quiz');
});
$('btn-copy').addEventListener('click', () => {
  const text = window.__shareText || '';
  if (legacyCopy(text)){
    toast('命盘已复制，去粘贴吧');
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(() => toast('命盘已复制，去粘贴吧'))
      .catch(() => toast('复制失败，截图更方便'));
    return;
  }
  toast('复制失败，截图更方便');
});
</script>
